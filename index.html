<!doctype html>
<html lang="th" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ร้าน ส.มอเตอร์ไซค์ - แพลตฟอร์มประมูลรถจักรยานยนต์ออนไลน์</title>
    
    <!-- โหลด Tailwind CSS CDN สำหรับตกแต่งสไตล์สปอร์ต -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                red: '#dc2626',
                darkred: '#991b1b',
                bg: '#020617',
                card: '#0f172a',
                border: '#1e293b'
              }
            }
          }
        }
      }
    </script>
    
    <!-- โหลด ฟอนต์ Kanit สปอร์ต -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,600;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
    
    <style>
      * {
        font-family: 'Kanit', sans-serif;
      }
      body {
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
